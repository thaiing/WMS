    <title>首页</title>
  </head>

  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
    <!-- GPS 视频引用的js -->
    <script type="module" src="/src/utils/gps/flv.min.js"></script>

    <!-- 天地图 引用的js  tk=key -->
    <script>
      let tkList = ['6013d88d23ea49c2b83bbfac8a9761e2'];

      // Randomly select a token from the list
      const randomToken = tkList[Math.floor(Math.random() * tkList.length)];

      // Create the script element with the random token
      const script = document.createElement('script');
      script.type = 'text/javascript';
      script.src = `http://api.tianditu.gov.cn/api?v=4.0&tk=${randomToken}`;
      script.async = true;

      // Append the script to the document
      document.head.appendChild(script);
    </script>
  </body>

services:
  mysql:
    image: mysql:8.0.33
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: yrt-open-wms
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --lower-case-table-names=1
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./open-wms/script/sql/open-wms.sql:/docker-entrypoint-initdb.d/open-wms.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p123456"]
      interval: 10s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7.0
    command: ["redis-server", "--requirepass", "123456"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "123456", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  mongo:
    image: mongo:6
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: "123456"
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--username", "root", "--password", "123456", "--authenticationDatabase", "admin", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: rabbit
      RABBITMQ_DEFAULT_PASS: "123456"
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20

  rabbitmq-init:
    image: rabbitmq:3-management
    command: rabbitmqadmin -H rabbitmq -u rabbit -p 123456 declare exchange name=yrt.topic.wms type=topic durable=true
    depends_on:
      rabbitmq:
        condition: service_healthy

  minio:
    image: minio/minio:RELEASE.2023-04-13T03-08-07Z
    command: server --console-address :9001 /data
    environment:
      MINIO_ROOT_USER: rattan
      MINIO_ROOT_PASSWORD: ruoyi123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  backend:
    image: maven:3.9.9-eclipse-temurin-17
    working_dir: /app
    command: sh -c "mvn -Pdev -Dmaven.test.skip=true package && java -jar rattan-admin/target/rattan-admin.jar"
    environment:
      MYSQL_HOST: mysql
      MYSQL_DATABASE: yrt-open-wms
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: "123456"
      MYSQL_SLAVE_HOST: mysql
      MYSQL_SLAVE_DATABASE: yrt-open-wms
      MYSQL_SLAVE_USERNAME: root
      MYSQL_SLAVE_PASSWORD: "123456"
      REDIS_HOST: redis
      REDIS_PASSWORD: "123456"
      MONGO_HOST: mongo
      MONGO_DATABASE: yrt-open-wms
      MONGO_USERNAME: root
      MONGO_PASSWORD: "123456"
      MONGO_AUTH_DATABASE: admin
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: rabbit
      RABBITMQ_PASSWORD: "123456"
    ports:
      - "7861:7861"
    volumes:
      - ./open-wms:/app
      - maven-cache:/root/.m2
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
      rabbitmq-init:
        condition: service_completed_successfully

  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_URL: http://backend:7861/
    ports:
      - "8722:8722"
    volumes:
      - ./open-wms-ui:/app
      - frontend-node-modules:/app/node_modules
    depends_on:
      - backend

volumes:
  mysql-data:
  redis-data:
  mongo-data:
  rabbitmq-data:
  minio-data:
  maven-cache:
  frontend-node-modules:
